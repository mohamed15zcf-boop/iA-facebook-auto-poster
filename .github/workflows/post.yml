yaml
name: AI Auto Poster Bot

on:
  schedule:
    # كيخدم كل نهار مع 8 ديال الليل بتوقيت المغرب
    - cron: '0 19 * * *'
  workflow_dispatch:
    # هادي باش تقدر تشعلو بيدك من التيليفون

jobs:
  post-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: جيب الكود
        uses: actions/checkout@v3

      - name: وجد البايثون
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: نزل المكتبات
        run: pip install -r requirements.txt

      - name: شعل البوت
        run: python main.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
